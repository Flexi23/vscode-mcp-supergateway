services:
  gateway:
    build: .
    image: vscode-mcp-supergateway-backend:local
    command: ["node", "dist/gateway.js"]
    ports:
      - "8080:8080"
      - "3100:3100"
      - "8081:8081"
    environment:
      GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_PERSONAL_ACCESS_TOKEN}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL}
      BACKEND_PORT: "8081"
    volumes:
      - gateway-vault:/app/vault
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-vault:
  gateway-data:
