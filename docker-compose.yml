services:
  gateway:
    build: .
    image: vscode-mcp-supergateway-backend:local
    command: ["node", "dist/gateway.js"]
    ports:
      - "8080:8080"
      - "3100:3100"
      - "8081:8081"
      - "9749:9749"
    environment:
      GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_PERSONAL_ACCESS_TOKEN}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL}
      WORKSPACE_ROOT: /workspace
      BACKEND_PORT: "8081"
      CBM_UI_PORT: "9749"
      CBM_DEFAULT_PATH: /workspace
      CBM_AUTO_INDEX_PATH: /workspace
      CBM_CACHE_DIR: /root/cbm-cache
      SIYUAN_TOKEN: ${SIYUAN_TOKEN:-}
      SIYUAN_TOKEN_REQUIRED: ${SIYUAN_TOKEN_REQUIRED:-false}
      # Start with a manual first index; startup auto-index is intentionally off.
      CBM_AUTO_INDEX_ENABLED: "false"
    volumes:
      - ./gateway-data:/app/data
      - ${WORKSPACE_ROOT}:/workspace:ro
    restart: unless-stopped
    depends_on:
      - siyuan

  siyuan:
    image: b3log/siyuan
    command: ["serve", "--workspace=/siyuan/workspace/"]
    environment:
      SIYUAN_ACCESS_AUTH_CODE: ${SIYUAN_ACCESS_AUTH_CODE:-}
      SIYUAN_ACCESS_AUTH_CODE_BYPASS: ${SIYUAN_ACCESS_AUTH_CODE_BYPASS:-true}
    ports:
      - "6806:6806"
    volumes:
      # Derived from WORKSPACE_ROOT: this repo's own siyuan-workspace/ subfolder.
      - ${WORKSPACE_ROOT}/vscode-mcp-supergateway/siyuan-workspace:/siyuan/workspace
    restart: unless-stopped

