services:
  gateway:
    build: .
    image: vscode-mcp-supergateway-backend:local
    command: ["node", "dist/gateway.js"]
    ports:
      - "${MCP_GATEWAY_PUBLIC_PORT}:${MCP_GATEWAY_PUBLIC_PORT}"
      - "${ADMIN_UI_PORT}:${ADMIN_UI_PORT}"
    environment:
      GATEWAY_DATA_DIR: "/app/data"
      MCP_GATEWAY_ADMIN_PORT: ${MCP_GATEWAY_ADMIN_PORT}
      ADMIN_UI_PORT: ${ADMIN_UI_PORT}
      MCP_GATEWAY_PUBLIC_PORT: ${MCP_GATEWAY_PUBLIC_PORT}
      CBM_AUTO_INDEX_ENABLED: ${CBM_AUTO_INDEX_ENABLED}
      CBM_AUTO_INDEX_PATH: ${CBM_AUTO_INDEX_PATH}
      CBM_CACHE_DIR: "/root/cbm-cache"
      CBM_DEFAULT_PATH: ${CBM_DEFAULT_PATH}
      CBM_HOST_WORKSPACE_DIR: ${CBM_HOST_WORKSPACE_DIR}
      GITLAB_API_URL: ${GITLAB_API_URL}
      GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_PERSONAL_ACCESS_TOKEN}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL}
      MARKDOWN_VAULT_ROOT: ${MARKDOWN_VAULT_ROOT}
      SIYUAN_PORT: ${SIYUAN_PORT}
      SIYUAN_TOKEN: ${SIYUAN_TOKEN}
      SIYUAN_TOKEN_REQUIRED: ${SIYUAN_TOKEN_REQUIRED}
      SIYUAN_WORKSPACE_DIR: ${SIYUAN_WORKSPACE_DIR}
    volumes:
      - ${CBM_HOST_WORKSPACE_DIR}:/workspace:ro
      - ${CBM_HOST_DATA_DIR}:/app/data
      - ${CBM_HOST_CACHE_DIR}:/root/cbm-cache
    restart: unless-stopped
    depends_on:
      - siyuan

  siyuan:
    image: b3log/siyuan
    command: ["serve", "--workspace=/siyuan/workspace/"]
    environment:
      SIYUAN_PORT: ${SIYUAN_PORT}
      SIYUAN_ACCESS_AUTH_CODE: ${SIYUAN_ACCESS_AUTH_CODE}
      SIYUAN_ACCESS_AUTH_CODE_BYPASS: ${SIYUAN_ACCESS_AUTH_CODE_BYPASS}
    ports:
      - "${SIYUAN_PORT}:${SIYUAN_PORT}"
    volumes:
      # Absolute host path from SIYUAN_WORKSPACE_DIR — set explicitly in .env.
      - ${SIYUAN_WORKSPACE_DIR}:/siyuan/workspace
    restart: unless-stopped

